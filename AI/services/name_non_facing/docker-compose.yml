# =============================================================================
# name_non_facing Docker Compose 설정
# =============================================================================
# 실행 방법:
#   docker-compose up -d
#
# 로그 확인:
#   docker-compose logs -f name-non-facing-worker
#
# 종료:
#   docker-compose down
# =============================================================================

version: "3.8"

services:
  # ==========================================================================
  # RabbitMQ 메시지 브로커
  # ==========================================================================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: nnf-rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nnf-network

  # ==========================================================================
  # Name Non-Facing Worker (RabbitMQ Consumer) - 메인 서비스
  # ==========================================================================
  name-non-facing-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nnf-worker
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      # 실행 모드 (기본: worker)
      # RUN_MODE: worker
      
      # RabbitMQ 연결 설정
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      
      # 큐 이름 ( #TODO : 백엔드 협의 후 확정)
      INPUT_QUEUE: analysis.name_non_facing.request
      OUTPUT_QUEUE: analysis.name_non_facing.result
      
      # 디바이스 설정
      DEVICE: cuda
      WHISPER_DEVICE: cuda
      DIARIZATION_DEVICE: cuda
      SIXDREPNET_DEVICE: cuda
      
      # 모델 설정
      YOLO_HEAD_MODEL: yolo_p2layer_jh.pt
      WHISPER_MODEL_SIZE: large-v3
      
      # HuggingFace 토큰 (필수 - pyannote 다운로드용)
      # docker-compose 실행 전에 .env 파일에 설정하거나 여기에 직접 입력
      DIARIZATION_USE_AUTH_TOKEN: ${DIARIZATION_USE_AUTH_TOKEN}
      
      # 로깅
      LOG_LEVEL: INFO
    volumes:
      # 영상 파일 공유 (필요시)
      - ./sample_video:/app/sample_video:ro
      # 모델 캐시 (다운로드 시간 단축)
      - huggingface_cache:/root/.cache/huggingface
      - torch_cache:/root/.cache/torch
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - nnf-network

  # ==========================================================================
  # Health Check API (선택적 - 모니터링/상태 확인용)
  # ==========================================================================
  name-non-facing-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nnf-api
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      # API 모드로 실행
      RUN_MODE: api
      
      # RabbitMQ 연결 설정 (상태 확인용)
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nnf-network
    # 리소스 제한 (API는 GPU 불필요)
    # GPU가 필요한 경우 아래 주석 해제
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

networks:
  nnf-network:
    driver: bridge

volumes:
  rabbitmq_data:
  huggingface_cache:
  torch_cache:
