config: "configs/preflight.yaml"
cases:
  - name: "pass_ok"
    asset: "pass_ok.mp4"
    expect_passed: true
    expect_failure_reason: null

  - name: "fail_low_light"
    asset: "fail_low_light.mp4"
    expect_passed: false
    expect_failure_reason: "FAIL_LOW_LIGHT"

  - name: "fail_noise"
    asset: "fail_noise.mp4"
