  - name: "fail_face_count_1"
    asset: "fail_face_count_1.mp4"
    expect_passed: false
    expect_failure_reason: "FAIL_FACE_COUNT"

  - name: "fail_face_count_3"
    asset: "fail_face_count_3.mp4"
    expect_passed: false
    expect_failure_reason: "FAIL_FACE_COUNT"

  - name: "fail_roi_miss"
    asset: "fail_roi_miss.mp4"
    expect_passed: false
    expect_failure_reason: "FAIL_ROI_MISMATCH"
