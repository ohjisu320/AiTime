services:
  ai-task1:
    build:
      context: ../AI/services/pose-estimation
      dockerfile: ../../../docker/dockerfiles/Dockerfile.ai_task1
    container_name: ai-task1
    ports:
      - "8001:8001"
    volumes:
      - ../AI/services/pose-estimation/app:/app/app
      - huggingface_cache:/root/.cache/huggingface
    env_file:
      - ../AI/services/pose-estimation/.env.prod
    environment:
      - PYTHONUNBUFFERED=1
      - RABBITMQ_HOST=rabbitmq
      - DEVICE=cpu
    networks:
      - cmn-network
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python -m app.worker' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  huggingface_cache:
    driver: local

networks:
  cmn-network:
    external: true

